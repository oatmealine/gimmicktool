[package]
name = "gimmicktool"
version = "0.1.0"
description = "Interactive external NotITG inspector and debugger"
authors = ["moonstruck.nectar"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
process-memory = { git = "https://github.com/Kiiyya/rs-process-memory", branch = "32bit" }
regex = "1.13.1"
sysinfo = { version = "0.39.6", features = [ "system" ] }
thiserror = "2.0.20"
oneshot = { version = "0.2.1", features = [ "std" ] }
log = { version = "0.4.34", features = [ "std" ] }
pretty_env_logger = "0.5.0"
tauri-plugin-store = "2"

[profile.dev]
incremental = true
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.package.objc2]
debug-assertions = false
